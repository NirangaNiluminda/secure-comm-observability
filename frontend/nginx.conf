# ─────────────────────────────────────────────────────────────
# Nginx — SecureChat TLS termination
#
# Port 80  → permanent redirect to HTTPS
# Port 443 → TLS (cert from /etc/nginx/certs/), proxy to Flask
# ─────────────────────────────────────────────────────────────

# ── HTTP: redirect everything to HTTPS ───────────────────────
server {
    listen 80;
    server_name localhost;

    # 301 permanent redirect — browser caches this, future visits go direct to HTTPS
    return 301 https://$host:8443$request_uri;
}

# ── HTTPS: serve the app ──────────────────────────────────────
server {
    listen 443 ssl;
    server_name localhost;

    # ── TLS Certificate ───────────────────────────────────────
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # ── Strong TLS settings ───────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;          # TLS 1.3 handles this natively
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;          # disable for forward secrecy

    # ── Security headers ──────────────────────────────────────
    # HSTS: tell browsers to ALWAYS use HTTPS for this host (1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Prevent this site from being framed (clickjacking protection)
    add_header X-Frame-Options "DENY" always;
    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Don't leak referrer to external sites
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Permissions policy — deny all sensitive APIs
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── React SPA ─────────────────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── REST API proxy → Flask backend ────────────────────────
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;   # tells Flask the original scheme
        proxy_read_timeout 120s;
    }

    # ── Socket.IO proxy (HTTP long-poll + WebSocket upgrade → WSS) ──
    location /socket.io/ {
        proxy_pass          http://backend:5000;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_set_header    X-Real-IP  $remote_addr;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_cache_bypass  $http_upgrade;
        proxy_read_timeout  86400s;   # keep WebSocket alive for long sessions
    }
}
